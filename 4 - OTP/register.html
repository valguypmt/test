<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07182c">
  <meta name="description" content="Đăng ký tài khoản sinh viên trong hệ thống CTU - ATTT.">
  <link rel="stylesheet" href="register.css">
  <script src="index.js" defer></script>
  <script src="register.js" defer></script>
</head>
<body>
  <div class="register-background" aria-hidden="true"></div>
  <div class="register-overlay" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="CTU - ATTT, về trang chính">
    </a>
    <a class="home-link" href="index.html">Về trang chính</a>
  </header>

  <main class="register-main">
    <section class="register-card" aria-labelledby="formTitle">
      <!-- nhập mail, OTP và đồng ý xác minh -->
      <form id="emailStep" class="register-form" novalidate>
        <label class="field-label" for="studentEmail">Email sinh viên</label>
        <div class="email-row">
          <input id="studentEmail" type="email" autocomplete="email" placeholder="ten@student.ctu.edu.vn" required>
          <button id="sendCode" class="send-code-button" type="button">Gửi email</button>
        </div>
        <label class="field-label" for="otpCode">Mã xác minh (8 chữ số)</label>
        <input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Nhập mã OTP 8 số">
        <label class="consent-row" for="consent">
          <input id="consent" type="checkbox">
          <span>Tôi đồng ý sử dụng email sinh viên để xác minh danh tính và quản lí tài khoản</span>
        </label>
        <button class="primary-button" type="submit">Xác minh &amp; tiếp tục</button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <!-- nhập thông tin tk sau khi xác minh -->
      <form id="accountStep" class="register-form" hidden novalidate>
        <label class="field-label" for="verifiedEmail">Email đã xác minh</label>
        <input id="verifiedEmail" type="email" readonly>
        <label class="field-label" for="accountName">Tên đăng nhập mong muốn</label>
        <input id="accountName" type="text" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" autocomplete="off" placeholder="Ví dụ: Nguoi dung 1" aria-describedby="accountNameHelp" required>
        <label class="field-label" for="studentMajor">Mật khẩu mong muốn (trên 8 ký tự)</label>
        <input id="studentMajor" type="password" minlength="9" maxlength="20" autocomplete="new-password" placeholder="Ví dụ: 123456789" aria-describedby="majorHelp" required>
        <button class="primary-button" type="submit">Gửi yêu cầu tài khoản</button>
        <p id="accountMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <!-- trạng thái yêu cầu đã gửi -->
      <section id="statusStep" class="status-step" hidden aria-live="polite">
        <h1>Trạng thái tài khoản</h1>
        <p><strong>Tài khoản:</strong> <span id="submittedAccount"></span></p>
        <p><strong>Email:</strong> <span id="submittedEmail"></span></p>
        <p id="submittedMajorRow" hidden><strong>Mật khẩu tài khoản: </strong> <span id="submittedMajor"></span></p>
        <span id="registrationStatusBadge" class="pending-badge" data-status="pending">ĐANG CHỜ DUYỆT</span>
        <button id="refreshStatus" class="secondary-button" type="button">Làm mới trạng thái</button>
        <a class="back-link" href="index.html">Quay về trang chủ</a>
        <p id="statusMessage" class="form-message" role="status" aria-live="polite"></p>
      </section>

    </section>
  </main>
</body>
</html>
