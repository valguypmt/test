<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>Lookup</h1>
    <a href="moderator.html">Moderator</a>
  </header>

  <main>
    <!-- nhập mail + mật khẩu để tra cứu -->
    <label for="searchEmailInput">Email</label>
    <input id="searchEmailInput" type="text" autocomplete="username">
    <label for="searchPasswordInput">Password</label>
    <input id="searchPasswordInput" type="password" autocomplete="current-password">
    <button class="lookup-btn-search" type="button" onclick="handleSearch()">Search</button>

    <!-- loading và kq, mặc định ẩn -->
    <div id="loadingView" class="hidden">...</div>
    <section id="infoView" class="hidden">
      <p>Email: <span id="resEmail"></span></p>
      <p>Name: <span id="resAccountName"></span></p>
      <p>Status: <span id="resStatusTag"></span></p>
    </section>
  </main>
</body>
</html>
